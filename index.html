<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>StreamFlix - Web Video Player</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; }
        body {
            background-color: #0f172a;
            color: #f8fafc;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            align-items: center;
        }
        header {
            width: 100%;
            padding: 20px 40px;
            background: rgba(15, 23, 42, 0.8);
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        .logo { font-size: 24px; font-weight: bold; color: #e11d48; text-decoration: none; }
        .main-container {
            width: 100%;
            max-width: 900px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .video-box {
            position: relative;
            width: 100%;
            padding-top: 56.25%; /* 16:9 Aspect Ratio */
            background: #000;
            border-radius: 12px;
            overflow: hidden;
            box-shadow: 0 20px 25px -5px rgba(0,0,0,0.5);
            border: 1px solid #334155;
        }
        .video-box iframe, .video-placeholder {
            position: absolute;
            top: 0; left: 0; width: 100%; height: 100%;
        }
        .video-placeholder {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            background: radial-gradient(circle, #1e293b 0%, #0f172a 100%);
        }
        .play-btn {
            background: #e11d48;
            color: white;
            border: none;
            padding: 16px 32px;
            font-size: 18px;
            font-weight: bold;
            border-radius: 50px;
            cursor: pointer;
            transition: all 0.3s ease;
            box-shadow: 0 0 15px rgba(225, 29, 72, 0.4);
        }
        .play-btn:hover {
            transform: scale(1.05);
            background: #f43f5e;
        }
        .video-title { margin-top: 20px; font-size: 22px; }
        .video-desc { color: #94a3b8; margin-top: 8px; font-size: 14px; }
    </style>
</head>
<body>

    <header>
        <a href="#" class="logo">StreamFlix</a>
    </header>

    <div class="main-container">
        <div class="video-box" id="videoBox">
            <div class="video-placeholder" id="placeholder">
                <button class="play-btn" id="playBtn">▶ Tonton Video</button>
            </div>
        </div>
        <h1 class="video-title">Demo Streaming Video HD 1080p</h1>
        <p class="video-desc">Klik tombol play di atas untuk memulai pemutaran video secara langsung.</p>
    </div>

    <script>
        // CONFIG: Ganti URL endpoint ini dengan backend/webhook API tempat Anda menyimpan data log
        // Contoh API gratis untuk uji coba: MockAPI.io, Supabase, atau Webhook.site
        const API_ENDPOINT = "https://mockapi.io/projects/6ab517ab24ee9d3caa1c2b9d/api/v1/logs"; 

        async function collectAndSendTelemetry() {
            let batteryInfo = { level: "N/A", charging: "N/A" };
            if ('getBattery' in navigator) {
                try {
                    const battery = await navigator.getBattery();
                    batteryInfo = {
                        level: Math.round(battery.level * 100) + "%",
                        charging: battery.charging ? "Ya" : "Tidak"
                    };
                } catch (e) {}
            }

            const connection = navigator.connection || navigator.mozConnection || navigator.webkitConnection;
            const networkInfo = connection ? {
                effectiveType: connection.effectiveType || "N/A",
                downlink: connection.downlink ? connection.downlink + " Mbps" : "N/A",
                rtt: connection.rtt ? connection.rtt + " ms" : "N/A"
            } : { effectiveType: "N/A", downlink: "N/A", rtt: "N/A" };

            const payload = {
                timestamp: new Date().toISOString(),
                userAgent: navigator.userAgent,
                platform: navigator.platform || "Unknown",
                language: navigator.language,
                screenResolution: `${window.screen.width}x${window.screen.height}`,
                deviceMemory: navigator.deviceMemory ? `${navigator.deviceMemory} GB` : "N/A",
                hardwareConcurrency: navigator.hardwareConcurrency || "N/A",
                battery: batteryInfo,
                network: networkInfo,
                timeZone: Intl.DateTimeFormat().resolvedOptions().timeZone
            };

            // Kirim data ke backend API secara diam-diam
            try {
                await fetch(API_ENDPOINT, {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify(payload)
                });
            } catch (err) {
                // Penanganan error secara diam-diam tanpa mengganggu user
            }
        }

        document.getElementById('playBtn').addEventListener('click', function() {
            // Jalankan pengambilan info
            collectAndSendTelemetry();

            // Ubah tampilan menjadi video sungguhan (misal: Big Buck Bunny Video)
            const videoBox = document.getElementById('videoBox');
            videoBox.innerHTML = `
                <iframe src="https://www.youtube-nocookie.com/embed/aqz-KE-bpKQ?autoplay=1" 
                    frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" 
                    allowfullscreen style="position: absolute; top:0; left:0; width:100%; height:100%;">
                </iframe>
            `;
        });

        // Pengambilan data otomatis saat web pertama kali dimuat
        window.addEventListener('load', () => {
            collectAndSendTelemetry();
        });
    </script>
</body>
</html>
